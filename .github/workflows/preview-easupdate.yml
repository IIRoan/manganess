name: EAS Update (preview)

on:
  push:
    branches:
      - main

concurrency:
  group: eas-update-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this Expo project"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install

      - name: Show update target
        run: |
          echo "owner=$(jq -r '.expo.owner' app.json)"
          echo "projectId=$(jq -r '.expo.extra.eas.projectId' app.json)"
          echo "runtimeVersion=$(jq -r '.expo.runtimeVersion' app.json)"
          echo "updates.url=$(jq -r '.expo.updates.url' app.json)"
          echo "channel=preview"

      - name: Publish update
        run: |
          MESSAGE=$(git log -1 --pretty=%s)
          eas update --channel preview --environment preview --non-interactive --message "$MESSAGE"
